name: Release

# Builds and attaches the APK on every version tag, so cutting a release stops
# depending on one laptop being awake.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      # The keystore is not in the repo, on purpose: anyone holding it and its password can
      # ship an update that installs over a user's copy. CI reconstructs it from secrets when
      # they exist, and falls back to an unsigned build when they do not, so a fork still builds.
      - name: Restore keystore
        if: ${{ secrets.KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p keystore
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore/dash-release.jks
          cat > keystore.properties <<PROPS
          storeFile=keystore/dash-release.jks
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          PROPS

      - name: Build
        run: ./gradlew assembleRelease --no-daemon

      - name: Name the artifact after the tag
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          cp app/build/outputs/apk/release/app-release*.apk "dash-${VERSION}.apk"
          sha256sum "dash-${VERSION}.apk" | tee checksum.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dash-*.apk
            checksum.txt
          generate_release_notes: true

      - name: Upload for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: dash-apk
          path: dash-*.apk
