name: Release

# Builds and attaches the APK on every version tag, so cutting a release stops
# depending on one laptop being awake.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    # Secrets are mapped to env here on purpose. The `secrets` context is NOT available in a
    # step-level `if:`, and using it there makes the whole workflow file invalid, which GitHub
    # reports as a failed run on every push rather than as a syntax error. The `env` context
    # IS available in `if:`, so this is the supported way to make signing optional.
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      # The keystore is not in the repo, on purpose: anyone holding it and its password can
      # ship an update that installs over a user's copy. CI reconstructs it from secrets when
      # they exist, and falls back to an unsigned build when they do not, so a fork still builds.
      - name: Restore keystore
        if: env.KEYSTORE_BASE64 != ''
        run: |
          mkdir -p keystore
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > keystore/dash-release.jks
          {
            echo "storeFile=keystore/dash-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Name the artifact after the tag
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          cp app/build/outputs/apk/release/app-release*.apk "dash-${VERSION}.apk"
          sha256sum "dash-${VERSION}.apk" | tee checksum.txt

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dash-*.apk
            checksum.txt

      - name: Upload for manual runs
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: dash-apk
          path: dash-*.apk
